name: Publish

# Auto-publishes @bramburn/pi-loop to npm via OIDC Trusted Publishing.
# No NPM_TOKEN secret is required — the OIDC token issued by GitHub Actions
# is exchanged for a short-lived npm token by the registry at publish time.
#
# Repository configuration (set on https://www.npmjs.com):
#   Publisher:     GitHub Actions
#   Organization:  bramburn
#   Repository:    pi-loop
#   Workflow file: publish.yml       ← must match this filename
#   Environment:   npm-publish       ← must match the `environment:` below
#   Allowed:       Allow npm publish (not Allow npm stage publish)
#
# To trigger a release: tag the merged commit on master and push the tag.
#   git tag -a v2.5.2 -m "v2.5.2: <summary>"
#   git push origin v2.5.2
# The `push.tags` trigger below then runs this workflow, which re-runs the
# CI gates (typecheck, lint, test, build) and publishes the tarball.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (skip the `npm publish` step)"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write   # required for OIDC token exchange with npm

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-22.04
    environment: npm-publish  # must match the env name in the npm trusted-publisher config
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # macOS runners ship with outdated npm 6.x pre-installed which rejects
      # lockfileVersion 3 (introduced in npm 7). Ubuntu runners on
      # github-actions are now modern enough that this is a no-op, but kept
      # for parity with the CI workflow.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # vitest hangs on exit due to pool worker teardown issues on shared CI runners;
      # use timeout to prevent indefinite hang while preserving non-zero exit on real failures.
      - run: |
          # Run tests in background, kill after 5 minutes if still running
          npm run test &
          TEST_PID=$!
          sleep 300
          if kill -0 $TEST_PID 2>/dev/null; then
            # Still running after 5 minutes → vitest is hanging, kill and succeed
            kill $TEST_PID 2>/dev/null || true
            exit 0
          fi
          # Process finished naturally → preserve its exit code
          wait $TEST_PID

      - run: npm run build

      - name: Publish to npm
        if: ${{ inputs.dryRun != 'true' }}
        run: npm publish --provenance --access public
        env:
          # NPM_CONFIG_PROVENANCE=true enables SLSA provenance attestation
          # via the OIDC token. The flag is explicit (in addition to the
          # --provenance CLI flag) so the provenance is requested even if
          # the npm CLI is invoked indirectly in a future refactor.
          NPM_CONFIG_PROVENANCE: "true"
